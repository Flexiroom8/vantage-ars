# Vantage-ARS. Put your settings in .env (copy .env.example).
# Without DATABASE_URL, data lives in embedded PGLite on the "data" volume.
#
# The second service is the autonomy heartbeat: it ticks /api/cron/floor every
# ten minutes with CRON_SECRET, so an unattended server never depends on
# GitHub Actions cron (best-effort on quiet repositories) or an external
# uptime monitor. See docs/autonomy-runbook.md.
services:
  app:
    build: .
    image: vantage-ars:latest
    restart: unless-stopped
    env_file: .env
    environment:
      PGLITE_DATA_DIR: /data/pglite
    ports:
      - "3000:3000"
    volumes:
      - data:/data

  scheduler:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on:
      - app
    env_file: .env
    environment:
      BASE_URL: http://app:3000
      TICK_INTERVAL: "600"
    volumes:
      - ./scripts/self-scheduler.sh:/scheduler.sh:ro
    entrypoint: ["/bin/sh", "/scheduler.sh"]

volumes:
  data:
