name = "vantage-ars"
main = "src/worker.production.js"
compatibility_date = "2026-09-28"
account_id = "8501d3eeac693b7ada630058ee5e081a"

workers_dev = true
preview_urls = true

# ============================================================
# D1 — VANTAGE ARS PRIMARY DATABASE
# ============================================================

[[d1_databases]]
binding = "DB"
database_name = "vantage-data"
database_id = "9eed1616-7546-4855-a150-11a92fb7621c"


# ============================================================
# WORKERS AI
# ============================================================

[ai]
binding = "AI"


# ============================================================
# DURABLE WORKFLOW
# ============================================================

[[workflows]]
binding = "AGENT_WORKFLOW"
name = "vantage-agent-task"
class_name = "AgentTaskWorkflow"


# ============================================================
# SCHEDULES
# ============================================================
#
# Monday 07:00 UTC
# Existing Writer/content cycle
#
# Every 15 minutes
# Autonomous operating/task scheduler
#
# Deploy-time default; override per environment in the Cloudflare dashboard.
#

[triggers]
crons = [
  "0 7 * * 1",
  "*/15 * * * *"
]


# ============================================================
# VERCEL FALLBACK (app routes the Worker does not own)
# ============================================================
#
# Unknown paths are proxied to this origin so the content site and the Vercel
# application coexist on the custom domains. Override per environment with the
# VERCEL_ORIGIN Worker variable if the Vercel project lives elsewhere.
[vars]
VERCEL_ORIGIN = "https://vercel.vantage-ars.co.za"

# ============================================================
# CUSTOM DOMAINS
# ============================================================

[[routes]]
pattern = "vantage-ars.co.za"
custom_domain = true

[[routes]]
pattern = "www.vantage-ars.co.za"
custom_domain = true


# ============================================================
# OBSERVABILITY
# ============================================================

[observability]
enabled = true
