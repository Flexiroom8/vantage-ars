name: Deploy vantage-ars worker

on:
  push:
    branches:
      - main
    paths:
      - "workers/vantage-ars/**"
      - ".github/workflows/deploy-vantage-ars.yml"
  workflow_dispatch:

concurrency:
  group: deploy-vantage-ars
  cancel-in-progress: true

jobs:
  deploy:
    name: Apply D1 and deploy worker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: workers/vantage-ars

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply D1 schema
        run: npx --yes wrangler@4.151.0 d1 execute vantage-data --remote --file=schema.sql --yes --config wrangler.toml

      - name: Seed D1 data
        run: npx --yes wrangler@4.151.0 d1 execute vantage-data --remote --file=seed.sql --yes --config wrangler.toml

      - name: Deploy worker
        run: npx --yes wrangler@4.151.0 deploy --config wrangler.toml

      - name: Set ADMIN_TOKEN (if configured)
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -n "$ADMIN_TOKEN" ]; then
            printf '%s' "$ADMIN_TOKEN" | npx --yes wrangler@4.151.0 secret put ADMIN_TOKEN --config wrangler.toml
            echo "ADMIN_TOKEN secret set."
          else
            echo "ADMIN_TOKEN secret not configured — leaving the existing Worker secret unchanged."
          fi
