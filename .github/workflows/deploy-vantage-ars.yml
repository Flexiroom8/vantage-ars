name: Deploy vantage-ars Worker

on:
  push:
    branches:
      - main
      - master
    paths:
      - "workers/vantage-ars/**"

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # wrangler auto-detects this env var; account_id lives in wrangler.toml.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler
        run: npm install --no-save wrangler@4

      - name: Apply D1 schema
        run: npx wrangler@4 d1 execute vantage-data --config workers/vantage-ars/wrangler.toml --remote --file=schema.sql --yes

      - name: Seed D1 data
        run: npx wrangler@4 d1 execute vantage-data --config workers/vantage-ars/wrangler.toml --remote --file=seed.sql --yes

      - name: Deploy Worker
        run: npx wrangler@4 deploy --config workers/vantage-ars/wrangler.toml --minify
