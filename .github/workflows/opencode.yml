name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Task for OpenCode"
        required: true
        type: string

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  opencode:
    name: OpenCode Agent
    runs-on: ubuntu-24.04

    # For comments, only run when /oc or /opencode is present.
    # workflow_dispatch is always allowed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.comment.body || '', '/oc') ||
      contains(github.event.comment.body || '', '/opencode')

    timeout-minutes: 45

    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read

    steps:
      # ------------------------------------------------------------
      # 1. Basic diagnostics
      # ------------------------------------------------------------
      - name: Run information
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo " Vantage-ARS OpenCode"
          echo "========================================"
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Event      : $GITHUB_EVENT_NAME"
          echo "Ref        : $GITHUB_REF"
          echo "SHA        : $GITHUB_SHA"
          echo "Actor      : $GITHUB_ACTOR"
          echo "Run ID     : $GITHUB_RUN_ID"
          echo "Run number : $GITHUB_RUN_NUMBER"
          echo "Runner OS  : $RUNNER_OS"
          echo "========================================"

      # ------------------------------------------------------------
      # 2. Checkout
      # ------------------------------------------------------------
      - name: Checkout Vantage-ARS
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # ------------------------------------------------------------
      # 3. Repository diagnostics
      # ------------------------------------------------------------
      - name: Repository diagnostics
        shell: bash
        run: |
          set -euo pipefail

          echo "Node:"
          node --version || true

          echo
          echo "npm:"
          npm --version || true

          echo
          echo "Git:"
          git --version

          echo
          echo "Current branch/ref:"
          git status --short --branch

          echo
          echo "Recent commits:"
          git log --oneline -5 || true

          echo
          echo "Repository root:"
          ls -la

      # ------------------------------------------------------------
      # 4. Determine prompt
      # ------------------------------------------------------------
      - name: Prepare manual prompt
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          MANUAL_PROMPT: ${{ inputs.prompt }}
        run: |
          set -euo pipefail

          {
            echo 'OPENCODE_MANUAL_PROMPT<<EOF'
            printf '%s\n' "$MANUAL_PROMPT"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # 5. Run official OpenCode GitHub Action
      #
      # IMPORTANT:
      # This uses GitHub's repository token directly.
      #
      # XAI_API_KEY must exist under:
      # Settings -> Secrets and variables -> Actions
      # ------------------------------------------------------------
      - name: Run OpenCode
        id: opencode
        uses: anomalyco/opencode/github@latest

        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        with:
          # Explicit provider/model.
          #
          # If your OpenCode installation reports a different current
          # xAI model ID, change ONLY this value.
          model: xai/grok-4

          # Use GitHub's built-in token instead of requiring the
          # OpenCode GitHub App/OIDC token exchange.
          use_github_token: true

          # Do not publish/share OpenCode sessions.
          share: false

          # Default trigger phrases.
          mentions: /opencode,/oc

          # Manual Actions -> Run workflow support.
          prompt: ${{ github.event_name == 'workflow_dispatch' && env.OPENCODE_MANUAL_PROMPT || '' }}

      # ------------------------------------------------------------
      # 6. Success diagnostics
      # ------------------------------------------------------------
      - name: OpenCode completed successfully
        if: success()
        shell: bash
        run: |
          echo "========================================"
          echo " OpenCode completed successfully"
          echo "========================================"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Run:        $GITHUB_RUN_ID"
          echo "SHA:        $GITHUB_SHA"
          echo "========================================"

      # ------------------------------------------------------------
      # 7. Failure diagnostics
      #
      # Unlike the old lifecycle workflow, don't hide the failure
      # behind opencode-run.exit.
      # ------------------------------------------------------------
      - name: Failure diagnostics
        if: failure()
        shell: bash
        run: |
          echo "::error::OpenCode failed."

          echo
          echo "========================================"
          echo " FAILURE DIAGNOSTICS"
          echo "========================================"

          echo
          echo "--- Git status ---"
          git status --short --branch || true

          echo
          echo "--- Recent commits ---"
          git log --oneline -10 || true

          echo
          echo "--- Environment validation ---"

          if [ -n "${XAI_API_KEY:-}" ]; then
            echo "XAI_API_KEY: configured"
          else
            echo "::error::XAI_API_KEY is NOT configured."
          fi

          if [ -n "${GITHUB_TOKEN:-}" ]; then
            echo "GITHUB_TOKEN: available"
          else
            echo "::error::GITHUB_TOKEN is unavailable."
          fi

          echo
          echo "--- OpenCode files ---"

          find "$HOME" \
            -maxdepth 4 \
            \( -iname '*opencode*.log' \
               -o -iname 'opencode-run.exit' \
               -o -iname 'opencode-run.log' \) \
            -print 2>/dev/null || true

          echo
          echo "========================================"
          echo " Inspect the 'Run OpenCode' step above"
          echo " for the primary provider/model error."
          echo "========================================"

        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
