name: Weekly Allocator + Analytics refresh

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Pull analytics (GSC + Cloudflare) - dry mode until secrets set
        env:
          GSC_JSON_KEY: ${{ secrets.GSC_JSON_KEY }}
          GSC_SITE_BRANCH_A: ${{ secrets.GSC_SITE_BRANCH_A }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_SITE_TAG: ${{ secrets.CF_SITE_TAG }}
        run: node scripts/pull-analytics.mjs
      - name: Cluster scoring (Branch B internal loop)
        run: node scripts/cluster-score.mjs
      - name: Branch allocation scoring
        run: node scripts/allocator.mjs
      - name: Rebuild dashboard dist (data.json refresh)
        run: node scripts/build-dashboard.mjs
      - name: Commit updated data + dashboard
        run: |
          git config user.name "vantage-bot"
          git config user.email "actions@github.com"
          git add data/ dashboard/dist/ || true
          git commit -m "chore: weekly data refresh" || echo "nothing to commit"
          git push
